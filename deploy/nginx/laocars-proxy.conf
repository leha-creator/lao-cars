# ВРЕМЕННЫЙ конфиг для СТАРОГО сервера 194.67.121.190 на окно смены DNS.
#
# Не для нового сервера и не для постоянной работы. Ставится на старую
# машину вместо laocars.conf в момент переключения (задача 20 плана
# migrate-prod-to-new-server) и снимается вместе с проксированием
# (задача 23), когда посетители перестают приходить на старый адрес.
#
# Зачем: после смены записи DNS часть посетителей ещё держит в кеше
# старый адрес. Здесь они не получают ни 503, ни вторую базу — nginx
# отдаёт им новый сервер, и все заявки пишутся в одну базу.
#
#     ln -sfn /var/www/laocars/deploy/nginx/laocars-proxy.conf \
#             /etc/nginx/sites-enabled/laocars.conf
#     nginx -t && systemctl reload nginx
#
# Возврат — тот же симлинк на laocars.conf.
#
# Адрес посетителя: приложение на новом сервере увидит IP старого
# сервера, потому что trustProxies не настроен (решение 5 плана).
# X-Forwarded-* ставятся всё равно — ради дня, когда он появится.

upstream laocars_new {
    server 134.0.113.242:443;
    keepalive 8;
}

# --- HTTP: только ACME и редирект, как в laocars.conf -------------------

server {
    listen 80;
    listen [::]:80;

    server_name laocars.ru www.laocars.ru;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://laocars.ru$request_uri;
    }
}

# --- HTTPS: www отдаёт редирект на apex --------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.laocars.ru;

    ssl_certificate     /etc/letsencrypt/live/laocars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laocars.ru/privkey.pem;
    include /etc/nginx/snippets/laocars-ssl.conf;

    return 301 https://laocars.ru$request_uri;
}

# --- HTTPS: всё остальное уходит на новый сервер -----------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name laocars.ru;

    ssl_certificate     /etc/letsencrypt/live/laocars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laocars.ru/privkey.pem;
    include /etc/nginx/snippets/laocars-ssl.conf;

    # Согласовано с laocars.conf: иначе загрузка фото через прокси
    # отвалится на этой границе, а не на новом сервере.
    client_max_body_size 16m;

    access_log /var/log/nginx/laocars-proxy-access.log;
    error_log  /var/log/nginx/laocars-proxy-error.log;

    location / {
        proxy_pass https://laocars_new;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Бьём в IP, а сертификат выписан на имя: без этих трёх строк
        # новый сервер ответил бы первым server-блоком, а проверка
        # сертификата не прошла бы.
        proxy_set_header Host laocars.ru;
        proxy_ssl_server_name on;
        proxy_ssl_name laocars.ru;

        # Проверка сертификата нового сервера. Без неё прокси согласился
        # бы на любую подмену на пути между машинами.
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_ssl_session_reuse on;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Выкат на новом сервере держит `artisan down` около 15 секунд —
        # прокси не должен рвать соединение раньше.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
