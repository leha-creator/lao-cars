# Параметры TLS, общие для обоих HTTPS-блоков ЛАО КАРС.
#
# Ставится копированием, а НЕ симлинком из репозитория:
#
#     sudo cp /var/www/laocars/deploy/nginx/laocars-ssl.conf \
#             /etc/nginx/snippets/laocars-ssl.conf
#
# Копией, потому что этот файл подключается директивой `include` из
# основного конфига, и nginx читает его при старте до того, как что-либо
# знает про /var/www. Держать его вне каталога приложения означает, что
# сломанный или недоклонированный `/var/www/laocars` не мешает nginx
# подняться и отдать хотя бы страницу ошибки.
#
# Написан руками, а не взят из `options-ssl-nginx.conf` certbot: тот файл
# создаёт пакет `python3-certbot-nginx`, а плагин `--nginx` в этом
# проекте не используется намеренно (см. шапку laocars.conf). Ссылаться
# на файл, которого установка не создаёт, значит получить nginx, который
# не стартует, — и выяснится это при перезагрузке сервера, а не сразу.

# TLS 1.2 и 1.3. Более старые версии не включаются: клиентов, которым
# они нужны, у автосалона в Москве нет, а поддержка их стоит известных
# уязвимостей.
ssl_protocols TLSv1.2 TLSv1.3;

# Набор шифров только для 1.2 — в 1.3 набор фиксирован протоколом
# и этой директивой не управляется. Порядок оставлен клиенту
# (`ssl_prefer_server_ciphers off`): современные клиенты лучше знают,
# что быстрее на их железе, а список ниже и так не содержит слабых.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Кеш сессий общий на воркеры: без него каждый повторный заход платит
# полное рукопожатие.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling: сервер сам приносит подтверждение, что сертификат
# не отозван, вместо того чтобы браузер шёл за ним к удостоверяющему
# центру. На этом хостинге это ещё и вопрос доступности — исходящие
# соединения тут фильтруются выборочно (см. историю с api.telegram.org).
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/letsencrypt/live/laocars.ru/chain.pem;
resolver 127.0.0.53 valid=300s;
resolver_timeout 5s;
