# Виртуальный хост ЛАО КАРС.
#
# Живёт в репозитории и симлинкуется в sites-enabled — так он правится
# через git и приезжает вместе с кодом, а не только на сервере:
#
#     sudo ln -s /var/www/laocars/deploy/nginx/laocars.conf \
#                /etc/nginx/sites-enabled/laocars.conf
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
# ЭТОТ ФАЙЛ ПРАВИТ certbot. После `certbot --nginx` он допишет сюда
# блок `listen 443 ssl`, пути к сертификатам и редирект с 80-го порта.
# Изменения certbot коммитить в репозиторий НЕ нужно и вредно: пути
# сертификатов машинно-зависимы. Если конфиг придётся править после
# выпуска — править здесь, а из sites-enabled симлинк уже смотрит сюда.

server {
    listen 80;
    listen [::]:80;

    server_name laocars.ru;

    root /var/www/laocars/public;
    index index.php;

    charset utf-8;

    # Согласовано с PHP (`upload_max_filesize=16M`, `post_max_size=20M`)
    # и с потолком приложения в 12288 КБ (`config/images.php`). Лимиты
    # обязаны расти в этом порядке: приложение < PHP < nginx. Нарушенный
    # порядок означает, что крупный файл отвалится НЕ валидацией Livewire
    # с внятным сообщением, а пустым ответом уровнем ниже.
    client_max_body_size 16m;

    access_log /var/log/nginx/laocars-access.log;
    error_log  /var/log/nginx/laocars-error.log;

    # WebP и woff2 сжимать бессмысленно — они уже сжаты.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # CSP здесь НЕ вводится намеренно. На сайте есть инлайновый JSON-LD
    # (`CarStructuredData`) и инлайновые `x-data` Alpine, то есть
    # корректная политика требует отдельной работы с nonce, а неверная
    # тихо ломает интерактив: разметка и стили на месте, клики не
    # работают. Это отдельная задача, а не строка в конфиге.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Service worker для push-уведомлений сотрудникам (веха 4.7).
    #
    # Отдаётся С КОРНЯ и без переписывания пути: область видимости
    # service worker'а равна каталогу, из которого он отдан, и `/sw.js`
    # из подкаталога не смог бы обслуживать страницы панели.
    #
    # `no-cache` обязателен и не подпадает под общее правило кеширования
    # статики ниже: обновлённый worker иначе залипает у уже
    # подписавшегося сотрудника на срок кеша, а симптом читается как
    # «push перестали приходить» — то есть ищется в ключах VAPID
    # и в подписке, а не в заголовке ответа.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Сборка Vite: имена содержат хеш содержимого, поэтому год и immutable
    # безопасны — изменённый файл приезжает под другим именем.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Медиа. Имена НЕ хешируются (`ImageProcessor` кладёт файл под своим
    # именем), поэтому год здесь означал бы, что заменённое в панели фото
    # не обновится у посетителя до истечения кеша. Тридцать дней —
    # компромисс между трафиком и «поправил фото, а его не видно».
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # `fastcgi_params` подключается ОБЯЗАТЕЛЬНО и именно так:
        # оттуда приезжает `fastcgi_param HTTPS $https if_not_empty`,
        # без которого PHP не узнаёт о TLS. Laravel в этом случае считает
        # соединение открытым и генерирует `http://`-ссылки на HTTPS-
        # странице: браузер ругается на смешанный контент, а `url()`
        # в микроразметке отдаёт схему, которой у страницы нет.
        include fastcgi_params;

        fastcgi_pass unix:/run/php/laocars.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Первый выкат на холодном opcache плюс миграции: две минуты
        # умолчания сюда не укладываются, а обрыв на середине запроса
        # оставляет 502 без записи в лог приложения.
        fastcgi_read_timeout 120;

        fastcgi_hide_header X-Powered-By;
    }

    # Точечные файлы (`.env`, `.git/`, `.htaccess`) наружу не отдаются.
    # Исключение — каталог ACME: без него `certbot` не пройдёт проверку
    # HTTP-01, потому что она ходит ровно в `/.well-known/acme-challenge/`.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Канонический хост — apex. `www` обслуживается тем же сертификатом
# и отдаёт постоянный редирект.
#
# Без этого блока оба имени раздают одинаковый контент: для поиска это
# дубликаты страниц, а для сессии — две разные cookie, то есть вход
# в панель по одному имени не виден по другому, и сотрудник читает это
# как «меня разлогинило».
#
# Блок отдельный, а не `if ($host = www...)` внутри основного: `if`
# внутри location в nginx имеет известные побочные эффекты, и правило
# «отдельный server на каждое имя» здесь и короче, и безопаснее.
server {
    listen 80;
    listen [::]:80;

    server_name www.laocars.ru;

    # ACME и для www: сертификат запрашивается на оба имени, и проверка
    # для www ходит именно сюда. Без этого location редирект увёл бы
    # проверяющего на apex, и выпуск сертификата упал бы целиком.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    # Цель редиректа — сразу `https`, а не `http`. После выпуска
    # сертификата вариант с `http` дал бы два перехода подряд
    # (www:80 → apex:80 → apex:443) на каждом заходе. Прыжок через
    # `location ^~ /.well-known/` не проходит: префиксный `^~`
    # приоритетнее `location /`, поэтому проверка ACME для www
    # доберётся до файла, а не улетит редиректом.
    location / {
        return 301 https://laocars.ru$request_uri;
    }
}
