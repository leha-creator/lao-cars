# Виртуальный хост ЛАО КАРС.
#
# Живёт в репозитории и симлинкуется в sites-enabled — так он правится
# через git и приезжает вместе с кодом, а не только на сервере:
#
#     sudo ln -s /var/www/laocars/deploy/nginx/laocars.conf \
#                /etc/nginx/sites-enabled/laocars.conf
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
# CERTBOT ЭТОТ ФАЙЛ НЕ ПРАВИТ И ПРАВИТЬ НЕ ДОЛЖЕН.
#
# Сертификат выпускается режимом `certonly --webroot`, а TLS-блок ниже
# написан руками и лежит в git. Причина жёсткая: файл симлинкуется
# в sites-enabled ИЗ РЕПОЗИТОРИЯ, а `deploy.sh` делает `git reset --hard`.
# Плагин `--nginx` дописал бы директивы прямо сюда, и первый же выкат
# стёр бы их вместе с TLS. Симптом был бы отложенный и оттого злее:
# работающий nginx продолжает держать сертификат в памяти, и падение
# случилось бы при следующей перезагрузке — то есть через дни после
# выката, который его вызвал.
#
# Пути `/etc/letsencrypt/live/laocars.ru/` стабильны между продлениями:
# certbot обновляет файлы по этим же именам, поэтому машинно-зависимого
# в них ничего нет и держать их в репозитории безопасно.
#
# ЕСЛИ ВЫПУСКАЕТЕ СЕРТИФИКАТ ЗАНОВО — только `certonly`, никогда `--nginx`:
#
#     certbot certonly --webroot -w /var/www/html \
#             -d laocars.ru -d www.laocars.ru

# --- Общие фрагменты ---------------------------------------------------

# Проверка ACME. Нужна в КАЖДОМ блоке на порту 80, включая www: сертификат
# выписан на оба имени, и проверка для www ходит именно на www. Без этого
# location редирект увёл бы проверяющего на apex, и продление упало бы
# целиком — причём молча, за месяц до истечения.
#
# `^~` важен: префиксный матч приоритетнее `location /`, поэтому редирект
# ниже проверку не перехватывает.

# --- HTTP: только ACME и редирект --------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name laocars.ru www.laocars.ru;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://laocars.ru$request_uri;
    }
}

# --- HTTPS: www отдаёт редирект на apex --------------------------------
#
# Канонический хост — apex. Без этого блока оба имени раздавали бы
# одинаковый контент: для поиска это дубликаты страниц, а для сессии —
# две разные cookie, то есть вход в панель по одному имени не виден
# по другому, и сотрудник читает это как «меня разлогинило».
#
# Блок отдельный, а не `if ($host = www...)` внутри основного: `if`
# внутри location в nginx имеет известные побочные эффекты, и правило
# «отдельный server на каждое имя» здесь и короче, и безопаснее.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.laocars.ru;

    ssl_certificate     /etc/letsencrypt/live/laocars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laocars.ru/privkey.pem;
    include /etc/nginx/snippets/laocars-ssl.conf;

    return 301 https://laocars.ru$request_uri;
}

# --- HTTPS: сам сайт ---------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name laocars.ru;

    ssl_certificate     /etc/letsencrypt/live/laocars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laocars.ru/privkey.pem;
    include /etc/nginx/snippets/laocars-ssl.conf;

    root /var/www/laocars/public;
    index index.php;

    charset utf-8;

    # Согласовано с PHP (`upload_max_filesize=16M`, `post_max_size=20M`)
    # и с потолком приложения в 12288 КБ (`config/images.php`). Лимиты
    # обязаны расти в этом порядке: приложение < PHP < nginx. Нарушенный
    # порядок означает, что крупный файл отвалится НЕ валидацией Livewire
    # с внятным сообщением, а пустым ответом уровнем ниже.
    client_max_body_size 16m;

    access_log /var/log/nginx/laocars-access.log;
    error_log  /var/log/nginx/laocars-error.log;

    # WebP и woff2 сжимать бессмысленно — они уже сжаты.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # CSP здесь НЕ вводится намеренно. На сайте есть инлайновый JSON-LD
    # (`CarStructuredData`) и инлайновые `x-data` Alpine, то есть
    # корректная политика требует отдельной работы с nonce, а неверная
    # тихо ломает интерактив: разметка и стили на месте, клики не
    # работают. Это отдельная задача, а не строка в конфиге.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS включается ТОЛЬКО после того, как HTTPS подтверждён рабочим.
    # Заголовок на неисправном сертификате запирает сайт у всех, кто
    # успел его получить, на весь max-age — откатить это нельзя ничем,
    # кроме ожидания. Без `includeSubDomains` и `preload` по той же
    # причине: оба расширяют радиус необратимой ошибки.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Service worker для push-уведомлений сотрудникам (веха 4.7).
    #
    # Отдаётся С КОРНЯ и без переписывания пути: область видимости
    # service worker'а равна каталогу, из которого он отдан, и `/sw.js`
    # из подкаталога не смог бы обслуживать страницы панели.
    #
    # `no-cache` обязателен и не подпадает под общее правило кеширования
    # статики ниже: обновлённый worker иначе залипает у уже
    # подписавшегося сотрудника на срок кеша, а симптом читается как
    # «push перестали приходить» — то есть ищется в ключах VAPID
    # и в подписке, а не в заголовке ответа.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Сборка Vite: имена содержат хеш содержимого, поэтому год и immutable
    # безопасны — изменённый файл приезжает под другим именем.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Медиа. Имена НЕ хешируются (`ImageProcessor` кладёт файл под своим
    # именем), поэтому год здесь означал бы, что заменённое в панели фото
    # не обновится у посетителя до истечения кеша. Тридцать дней —
    # компромисс между трафиком и «поправил фото, а его не видно».
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # `fastcgi_params` подключается ОБЯЗАТЕЛЬНО и именно так:
        # оттуда приезжает `fastcgi_param HTTPS $https if_not_empty`,
        # без которого PHP не узнаёт о TLS. Laravel в этом случае считает
        # соединение открытым и генерирует `http://`-ссылки на HTTPS-
        # странице: браузер ругается на смешанный контент, а `url()`
        # в микроразметке отдаёт схему, которой у страницы нет.
        include fastcgi_params;

        fastcgi_pass unix:/run/php/laocars.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Первый выкат на холодном opcache плюс миграции: две минуты
        # умолчания сюда не укладываются, а обрыв на середине запроса
        # оставляет 502 без записи в лог приложения.
        fastcgi_read_timeout 120;

        fastcgi_hide_header X-Powered-By;
    }

    # Точечные файлы (`.env`, `.git/`, `.htaccess`) наружу не отдаются.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
